  capital: 1000
  state_path: state/us-live-tiny-001.json
  max_order_notional: 50
  max_active_orders: 1
  daily_loss_limit_pct: 0.01

basket:
  - symbol: AAPL
    exchange: SMART
    currency: USD
    market: US
    max_allocation: 50
    lot_size: 1
